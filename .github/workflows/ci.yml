name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repo — no token write scopes.
permissions:
  contents: read

# A newer push to the same branch cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned so `--frozen-lockfile` doesn't change meaning under a new Bun
          # release; bump together with the local Bun that writes bun.lock.
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test (with coverage gate)
        run: bun run test:coverage

      # Catches production-bundler/adapter failures that svelte-check and the
      # Vitest source transform don't — e.g. an unresolved import or a build-only
      # error that would otherwise only surface at deploy time.
      - name: Build
        run: bun run build

      # Knip and audit stay informational by choice: `bun run verify` (the local
      # gate) doesn't run them, so a blocking step here would turn CI red for
      # something the local gate passes. Knip is currently clean.
      - name: Dead-code scan (knip)
        run: bun run knip
        continue-on-error: true

      - name: Dependency audit
        run: bun audit
        continue-on-error: true
